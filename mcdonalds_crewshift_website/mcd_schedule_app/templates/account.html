{% extends 'base.html' %}{% block title %}Account{% endblock %}{% block crumb %}Account{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow red">SECURITY</div><h1>My account</h1><p class="muted">Update your login password.</p></div></div><div class="form-card narrow"><h2>{{me.full_name}}</h2><p class="muted">@{{me.username}} · {{me.role|capitalize}}</p><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Current password<input name="current_password" type="password" required></label><label>New password (10+ characters)<input name="password" minlength="10" type="password" required></label><button class="btn primary">Change password →</button></form></div>{% endblock %}
